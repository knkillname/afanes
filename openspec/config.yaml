schema: spec-driven

# Durable constraints that guide OpenSpec artifacts and workflows.
# Engineering detail lives in AGENTS.md; this file records only what an agent
# cannot infer from the code.
context: |
  Afanes is offline-only: no runtime network access, accounts, telemetry, or
  cloud storage. Durable user data lives in the Markdown vault; the SQLite index
  is a disposable cache.
  Code, UI copy, specs, and commits use neutral, original vocabulary; see
  AGENTS.md section 4.2 for the prohibited terms.
  Public Python APIs require strict NumPy-style docstrings that document every
  parameter, return value, raised exception, and public attribute.
  Every change must preserve macOS, Linux, and Windows parity.

# Advisory guidance read by /opsx-archive through `openspec instructions archive`.
operations:
  archive:
    guidance:
      - "After the archive succeeds, run the post-archive release workflow in AGENTS.md section 5.8 before reporting completion."
      - "Choose the semver bump from the archived change, then run hatch version patch, hatch version minor, or hatch version major. Never edit src/afanes/__about__.py by hand."
      - "Update CHANGELOG.md following Keep a Changelog: move Unreleased entries under the new version and date, add a fresh Unreleased section, and update comparison links."
      - "Review README.md and update it when the change affects installation, usage, features, platforms, configuration, or documented behavior. Record when no update is required."
      - "Run hatch check, hatch test --cover, openspec validate --all --strict, openspec doctor, and the vocabulary compliance check before committing."
      - "Create one release commit titled chore(release): vX.Y.Z with the archived change name in the body. Do not tag, push, or publish unless the maintainer asks."
