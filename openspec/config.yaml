schema: spec-driven

# Durable constraints that guide OpenSpec artifacts and workflows.
# Engineering detail lives in AGENTS.md; this file records only what an agent
# cannot infer from the code.
context: |
  Afanes is offline-only: no runtime network access, accounts, telemetry, or
  cloud storage. Durable user data lives in the Markdown vault. Each vault is
  scanned into an in-memory snapshot; there is no persistent index, and adding
  one requires an approved change.
  Code, UI copy, specs, and commits use neutral, original vocabulary; see
  AGENTS.md section 4.1 for the prohibited terms.
  Public Python APIs require strict NumPy-style docstrings that document every
  parameter, return value, raised exception, and public attribute.
  Every change must preserve macOS, Linux, and Windows parity.

# Advisory guidance read by /opsx-archive through `openspec instructions archive`.
operations:
  archive:
    guidance:
      - "After the archive succeeds, run the post-archive release workflow in AGENTS.md section 5.3 before reporting completion."
      - "Bump the version only when the archive completes a coherent milestone: 1.0.0 is reserved for the first MVP, and incompatible changes to unreleased APIs are MINOR or PATCH bumps. Use hatch version patch, hatch version minor, or hatch version major; never edit src/afanes/__about__.py by hand."
      - "Update CHANGELOG.md following Keep a Changelog: move Unreleased entries under the new version and date, add a fresh Unreleased section, and omit comparison links unless release tags exist."
      - "Review README.md and docs/ and update them when the change affects installation, usage, features, platforms, configuration, or documented behavior. Record README: no change required and Docs: no change required when neither changed."
      - "Run hatch run docs:build and the docs style test when docs/ or the documented examples change."
      - "Run hatch check, hatch test --cover, openspec validate --all --strict, openspec doctor, and the vocabulary compliance check before committing."
      - "Commit the archive with a subject that names the behavior it delivered, for example feat(note): adopt the three-note model and project steps, plus a body line Archived OpenSpec change: <change-name>. Implementation work is committed task by task during apply, so never squash it into the release commit and never title the commit only chore(release). Do not tag, push, or publish unless the maintainer asks."
