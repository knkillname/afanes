name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - "release/**"
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify the release identity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install Hatch
        run: |
          python -m pip install --upgrade pip
          python -m pip install hatch

      - name: Verify the tag, version, and changelog agree
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ "${REF_TYPE}" != "tag" ]; then
            echo "Dry run for ${REF_NAME}: the artifacts are built and uploaded, and no release is published."
            exit 0
          fi
          if ! printf '%s' "${REF_NAME}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag ${REF_NAME} is not v<major>.<minor>.<patch>."
            exit 1
          fi
          version="$(hatch version 2>/dev/null)"
          tag_version="${REF_NAME#v}"
          if [ "${tag_version}" != "${version}" ]; then
            echo "::error::Tag ${REF_NAME} does not match the project version ${version}."
            exit 1
          fi
          if ! grep -Eq "^## \[${version}\] - " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no released section for ${version}."
            exit 1
          fi
          echo "Release identity verified: ${REF_NAME} matches ${version}."

  build:
    name: Build the release artifacts
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install Hatch and uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install hatch uv

      - name: Create the Hatch environment
        run: hatch env create

      - name: Install the native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Run the automated gates
        run: |
          hatch check
          hatch test --cover

      - name: Build the Linux bundle
        run: hatch run package linux --yes --build-version "$(hatch version 2>/dev/null)"

      - name: Build the wheel
        run: hatch build -t wheel

      - name: Package the release artifacts
        run: |
          set -euo pipefail
          version="$(hatch version 2>/dev/null)"
          archive="afanes-linux-x64-${version}.tar.gz"
          wheel="afanes-${version}-py3-none-any.whl"
          tar -czf "${archive}" -C build/linux .
          cp "dist/${wheel}" "${wheel}"
          sha256sum "${archive}" "${wheel}" > "afanes-${version}-checksums.txt"
          cat "afanes-${version}-checksums.txt"
          {
            echo "## Release artifacts"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Version: \`${version}\`"
            echo "- Runner image: \`${ImageOS:-unknown}\` \`${ImageVersion:-unknown}\`"
            echo "- Archive: \`${archive}\`"
            echo "- Wheel: \`${wheel}\`"
            echo "- Checksums: \`afanes-${version}-checksums.txt\`"
            echo
            echo "### Checksums"
            echo '```'
            cat "afanes-${version}-checksums.txt"
            echo '```'
            echo
            echo "### Host"
            echo '```'
            uname -a
            grep -E '^(PRETTY_NAME|VERSION_ID)=' /etc/os-release || true
            clang --version | head -n 1
            cmake --version | head -n 1
            printf 'ninja '
            ninja --version
            printf 'pkg-config '
            pkg-config --version
            printf 'python '
            python --version 2>&1
            printf 'hatch '
            hatch --version
            printf 'flet '
            hatch run flet --version
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload the release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: afanes-release
          path: |
            afanes-linux-x64-*.tar.gz
            afanes-*-py3-none-any.whl
            afanes-*-checksums.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the release artifacts
        run: gh run download "${GITHUB_RUN_ID}" --name afanes-release --dir release

      - name: Verify the downloaded artifacts
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          cd release
          sha256sum -c "afanes-${version}-checksums.txt"

      - name: Refuse to replace a published release
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "::error::Release ${GITHUB_REF_NAME} already exists; published assets are immutable."
            exit 1
          fi

      - name: Compose the release notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          notes="release-notes.md"
          awk -v heading="## [${version}]" '
            index($0, heading) == 1 { capture = 1 }
            capture && /^## \[/ && index($0, heading) != 1 { exit }
            capture { print }
          ' CHANGELOG.md > "${notes}"
          if ! grep -q '[^[:space:]]' "${notes}"; then
            echo "::error::CHANGELOG.md has no released section for ${version}."
            exit 1
          fi
          {
            echo
            echo "## Build"
            echo
            echo "- Version: \`${version}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Runner image: \`${ImageOS:-unknown}\` \`${ImageVersion:-unknown}\`"
            echo
            echo "### Checksums"
            echo '```'
            cat "release/afanes-${version}-checksums.txt"
            echo '```'
          } >> "${notes}"

      - name: Publish the release
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --verify-tag \
            --title "Afanes ${version}" \
            --notes-file release-notes.md
          gh release upload "${GITHUB_REF_NAME}" \
            "release/afanes-linux-x64-${version}.tar.gz" \
            "release/afanes-${version}-py3-none-any.whl" \
            "release/afanes-${version}-checksums.txt"
          gh release edit "${GITHUB_REF_NAME}" --draft=false

      - name: Remove a draft that was not published
        if: failure()
        run: |
          set -euo pipefail
          state="$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
          if [ "${state}" = "true" ]; then
            gh release delete "${GITHUB_REF_NAME}" --yes
            echo "Removed the unpublished draft for ${GITHUB_REF_NAME}."
          fi
