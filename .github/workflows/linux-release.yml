name: Linux release

on:
  workflow_dispatch:
  push:
    branches:
      - "release/**"

permissions:
  contents: read

concurrency:
  group: linux-release
  cancel-in-progress: false

jobs:
  build:
    name: Build the Linux bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install Hatch and uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install hatch uv

      - name: Create the Hatch environment
        run: hatch env create

      - name: Install the native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Run the automated gates
        run: |
          hatch check
          hatch test --cover

      - name: Build the Linux bundle
        run: hatch run package linux --yes --build-version "$(hatch version)"

      - name: Package the artifact
        run: |
          set -euo pipefail
          version="$(hatch version)"
          archive="afanes-linux-x64-${version}.tar.gz"
          tar -czf "${archive}" -C build/linux .
          sha256sum "${archive}" | tee "${archive}.sha256"
          {
            echo "## Linux release artifact"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Version: \`${version}\`"
            echo "- Runner image: \`${ImageOS:-unknown}\` \`${ImageVersion:-unknown}\`"
            echo "- Archive: \`${archive}\`"
            echo "- SHA-256: \`$(sha256sum "${archive}" | cut -d' ' -f1)\`"
            echo
            echo "### Host"
            echo '```'
            uname -a
            grep -E '^(PRETTY_NAME|VERSION_ID)=' /etc/os-release || true
            clang --version | head -n 1
            cmake --version | head -n 1
            printf 'ninja '
            ninja --version
            printf 'pkg-config '
            pkg-config --version
            printf 'python '
            python --version 2>&1
            printf 'hatch '
            hatch --version
            printf 'flet '
            hatch run flet --version
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload the Linux bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: afanes-linux-x64
          path: |
            afanes-linux-x64-*.tar.gz
            afanes-linux-x64-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
